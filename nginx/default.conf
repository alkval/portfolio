# Same as the stock nginx:stable-alpine default.conf, plus two proxied paths for the
# self-hosted Umami statistics (cookieless). Only the tracker script and the collect endpoint
# are exposed; the Umami dashboard stays private on the tailnet.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Resolve the Umami container at request time, so the site still starts if Umami is down.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $umami http://umami:3000;

    location = /stats/script.js {
        proxy_pass $umami/script.js;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /stats/api/send {
        proxy_pass $umami/api/send;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
